<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobileBrowser Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>MobileBrowser</h1>
      <span class="tag">4-Panel | Mobile UA</span>
    </header>

    <div class="panels">
      <div class="panel-row" data-id="0">
        <span class="idx">P1</span>
        <input type="text" class="url" placeholder="Enter URL... (e.g. m.taobao.com)" data-id="0">
        <button class="btn go" data-id="0">Go</button>
        <button class="btn nav" data-action="back" data-id="0" title="Back">&#9664;</button>
        <button class="btn nav" data-action="forward" data-id="0" title="Forward">&#9654;</button>
        <button class="btn nav" data-action="reload" data-id="0" title="Reload">&#8635;</button>
        <button class="btn close" data-id="0" title="Close">&times;</button>
      </div>
      <div class="panel-row" data-id="1">
        <span class="idx">P2</span>
        <input type="text" class="url" placeholder="Enter URL... (e.g. m.jd.com)" data-id="1">
        <button class="btn go" data-id="1">Go</button>
        <button class="btn nav" data-action="back" data-id="1" title="Back">&#9664;</button>
        <button class="btn nav" data-action="forward" data-id="1" title="Forward">&#9654;</button>
        <button class="btn nav" data-action="reload" data-id="1" title="Reload">&#8635;</button>
        <button class="btn close" data-id="1" title="Close">&times;</button>
      </div>
      <div class="panel-row" data-id="2">
        <span class="idx">P3</span>
        <input type="text" class="url" placeholder="Enter URL... (e.g. m.weibo.cn)" data-id="2">
        <button class="btn go" data-id="2">Go</button>
        <button class="btn nav" data-action="back" data-id="2" title="Back">&#9664;</button>
        <button class="btn nav" data-action="forward" data-id="2" title="Forward">&#9654;</button>
        <button class="btn nav" data-action="reload" data-id="2" title="Reload">&#8635;</button>
        <button class="btn close" data-id="2" title="Close">&times;</button>
      </div>
      <div class="panel-row" data-id="3">
        <span class="idx">P4</span>
        <input type="text" class="url" placeholder="Enter URL... (e.g. m.baidu.com)" data-id="3">
        <button class="btn go" data-id="3">Go</button>
        <button class="btn nav" data-action="back" data-id="3" title="Back">&#9664;</button>
        <button class="btn nav" data-action="forward" data-id="3" title="Forward">&#9654;</button>
        <button class="btn nav" data-action="reload" data-id="3" title="Reload">&#8635;</button>
        <button class="btn close" data-id="3" title="Close">&times;</button>
      </div>
    </div>

    <footer>
      <span id="status">4 panels ready</span>
      <span class="ua-info">UA: iPhone iOS 17.5 Safari</span>
    </footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
