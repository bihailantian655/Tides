name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: npm install

      - name: Diagnose alloc-no-stdlib version conflict
        working-directory: src-tauri
        shell: bash
        run: |
          cargo generate-lockfile
          echo "=== Crates depending on alloc-no-stdlib ==="
          cargo tree -i alloc-no-stdlib -f "{p} {r}" 2>&1 || true
          echo ""
          echo "=== alloc-no-stdlib entries in lockfile ==="
          grep -A3 'name = "alloc-no-stdlib"' Cargo.lock 2>/dev/null || true
          echo ""
          echo "=== alloc-stdlib entries in lockfile ==="
          grep -A3 'name = "alloc-stdlib"' Cargo.lock 2>/dev/null || true

      - name: Build
        run: npx tauri build

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MobileBrowser-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/MobileBrowser.exe
          if-no-files-found: error
