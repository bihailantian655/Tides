[package]
name = "mobile-browser-tauri"
version = "1.0.0"
edition = "2021"

[lib]
name = "mobile_browser_tauri_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"
